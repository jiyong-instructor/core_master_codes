<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>크로스브라우징 - 폴리필 실습</title>

    <!-- Polyfill 다운로드 : 브라우저별 제공되지 않는 JS 기능들을 어떤 착한사람이 만들어 두었고 그것을 다운받아 적용합니다 -->
    <script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js"></script>

    <!-- 폴리필 적용을 통해서, 특정 최신 JS기능이 지원되지 않는 브라우저에서도 지원이 되게 만들어줄 수 있어요   -->
    <script>
        const 과일꺼내기 = () => {
            const 과일들 = ["사과", "바나나", "딸기"];
            console.log(과일들.at(-1)) // at(-1) => 배열의 마지막 요소를 가져옴 // 딸기
        }
    </script>
</head>
<body>
    <button onclick="과일꺼내기()">과일</button>
</body>
</html>
