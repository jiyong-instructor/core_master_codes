<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 접근성 예시</title>
</head>
<body>
    <!--  웹 접근성 이미지 안내  -->
    <img src="./00-image.jpg" alt="강아지 사진" width="100%" />

    <!--  웹 접근성 차단하기  -->
    <img src="./00-image.jpg" width="100px" alt="강아지이미지" aria-hidden="true" />

    <!--  웹 접근성 기본  -->
    <button>버튼이에요</button>
    <button aria-label="고객센터로 가는 버튼이에요">버튼이에요</button>
    <button role="검색버튼이에요">찾아보기</button>
</body>
</html>
