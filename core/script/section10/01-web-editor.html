<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹에디터 실습</title>

    <!-- quill.js 다운로드 -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
</head>
<body>


    <div id="editor">
        <p>Hello World!</p>
        <p>Some initial <strong>bold</strong> text</p>
        <p><br /></p>
    </div>

    <button onclick="자기소개등록기능()">등록하기</button>

</div>
</body>
<script>
  const quill = new Quill('#editor', {
    theme: 'snow'
  });

  const 자기소개등록기능 = () => {
    const 자기소개 = quill.getSemanticHTML();
    console.log(자기소개);

    localStorage.setItem("자기소개", 자기소개);

    // quill.setText("자기소개를 입력하세요");

    location.href = "02-web-editor.html";
  }
</script>
</html>
