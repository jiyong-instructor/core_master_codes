<!DOCTYPE html>
<html lang="ko">
<head>
    <title>박스 사이징</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .박스1 {
            width: 300px;
            height: 300px;
            background-color: green;
            padding-top: 30px;
            padding-left: 30px;
            border: 10px solid blue;
            box-sizing: border-box; /* 박스 사이징 속성은 박스의 크기를 계산하는 방법을 지정합니다. */
        }

    </style>
</head>
<body>
    <div class="박스1">
        <input type="text" />
    </div>
    <div class="박스1">
        <input type="text" />   
    </div>
</body>
</html>
