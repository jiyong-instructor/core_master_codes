<!DOCTYPE html>
<html lang="en">
<head>
    <title>Transform 실습</title>
    <style>
        .비틀기 {
            transform: skewX(30deg);
        }
        .확대 {
            transform: scaleX(1.5);
        }
        .X축뒤집기 {
            transform: rotateX(180deg);
        }
        .Y축뒤집기 {
            transform: rotateY(180deg);
        }
        .Z축뒤집기 {
            transform: rotateZ(35deg);
        }
    </style>
</head>
<body>
    <button class="비틀기">비틀기</button>
    <button class="확대">확대</button>
    <button class="X축뒤집기" >X axis 축 뒤집기</button>
    <button class="Y축뒤집기">Y axis 축 뒤집기</button>
    <button class="Z축뒤집기">Z axis 축 뒤집기</button>
</body>
</html>
