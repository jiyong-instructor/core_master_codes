<!DOCTYPE html>
<html lang="en">
<head>
    <title>토스트</title>
    <style>
        .토스트 {
            width: 300px;
            height: 30px;
            color: white;
            background-color: black;
            text-align: center;
            line-height: 30px;
            border-radius: 15px;

            animation-name: 토스트애니메이션;
            animation-duration: 3s;
        }

        @keyframes 토스트애니메이션 {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="토스트">
        복사되었어요
    </div>
</body>
</html>
