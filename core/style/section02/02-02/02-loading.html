<!DOCTYPE html>
<html lang="en">
<head>
    <title>로딩 실습</title>
    <style>
        .loading {
            width: 100px;
            height: 100px;
            border: 7px solid yellow;
            border-top-color: coral;
            border-radius: 100%;

            animation-name: 로딩애니메이션;
            animation-duration: 1s;
            animation-iteration-count: infinite;
        }

        @keyframes 로딩애니메이션 {
            /* from {
                transform: rotateZ(0deg);
            } */
            to {
                transform: rotateZ(360deg);
            }
        }

    </style>
</head>
<body>
    <div class="loading"></div>
</body>
</html>
