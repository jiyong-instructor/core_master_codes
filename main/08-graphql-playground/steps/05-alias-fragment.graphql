fragment FetchFields on Board {
  _id
  seller
  name
  detail
}

query FetchTwoProducts($firstProductId: ID!, $secondProductId: ID!) {
  # 같은 API를 두 번 요청할 때 alias로 응답 이름을 구분해요.
  firstProduct: fetchProduct(id: $firstProductId) {
    ...FetchFields
  }r
  secondProduct: fetchProduct(id: $secondProductId) {
    ...FetchFields
  }
}

