# 예제 API 말고도 트립트립 API도 같은 순서로 한번 연습해보세요.
# Docs에서 fetchTravelproducts → fetchTravelproduct →
# createTravelproduct → updateTravelproduct 순서로 찾아보세요.

# 1. 여행상품 목록 조회
query FetchTravelproducts($page: Int, $search: String, $isSoldout: Boolean) {
  fetchTravelproducts(page: $page, search: $search, isSoldout: $isSoldout) {
    _id
    name
    remarks
    contents
    price
    tags
    images
    pickedCount
    soldAt
    createdAt
    seller {
      _id
      name
    }
  }
}
# {
#   "page": 1,
#   "search": "",
#   "isSoldout": false
# }

# 2. 여행상품 한 개 조회
query FetchTravelproduct($travelproductId: ID!) {
  fetchTravelproduct(travelproductId: $travelproductId) {
    _id
    name
    remarks
    contents
    price
    tags
    images
    pickedCount
    soldAt
    createdAt
    seller {
      _id
      name
    }
  }
}

# {
#   "travelproductId": "6a26614cd4299d0029cd4847"
# }

# 3. 게시글 등록
mutation CreateBoard($input: CreateBoardInput!) {
      createBoard(createBoardInput: $input) {
      _id
      writer
      title
      contents
      youtubeUrl
      likeCount
      dislikeCount
      images
      createdAt
    }
  }

{
  "input": {
    "writer": "지용",
    "password": "666",
    "title": "한번 남겨보는 나의 트립트립 게시글",
    "contents": "낚시였습니다~~~",
    "youtubeUrl": "",
    "images": []
  }
}

# 4. 게시글 수정
mutation UpdateBoard($boardId: ID!, $password: String, $input: UpdateBoardInput!) {
  updateBoard(boardId: $boardId, password: $password, updateBoardInput: $input) {
      _id
      writer
      title
      contents
      youtubeUrl
      likeCount
      dislikeCount
      images
      createdAt
    }
}

