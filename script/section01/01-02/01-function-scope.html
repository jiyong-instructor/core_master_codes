<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>함수 실습</title>
    <script>
        // 여기는 JS 영역입니다.
        function 더하기() {
            const a = 1 + 2;
            console.log(a);
            return a;
        }

        // 함수를 실행
        더하기();

        // 새로운 변수 선언
        const 함수결과 = 더하기();

        console.log("함수가 반환한 결과 값 ", 함수결과)

        // 함수 인자값 전달하기
        function 더하기2(a, b) {
            // a와 b를 인자로 받아 결과를 저장해준다
            const result = a + b;
            return result;
        }

        // 함수를 실행
        const 함수결과2 = 더하기2(55, 45);
        console.log("함수가 반환한 결과 값2 ", 함수결과2);

    </script>
</head>
<body>
    
</body>
</html>
