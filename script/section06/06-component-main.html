<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>컴포넌트 실습</title>
    <style>
        .배너 {
            height: 100px;
            background-color: yellow;
        }

        .내비게이션 {
            height: 50px;
            background-color: green;
        }

    </style>
    <script src="./06-component-diary.js"></script>
    <script src="./06-component-dog.js"></script>
    <script>
        const 메뉴이동 = (내가클릭한것) => {
            switch(내가클릭한것) {
                case "일기클릭함":
                    document.getElementById("컴포넌트영역").innerHTML = 일기메뉴
                    break;
                case "강아지클릭함":
                    document.getElementById("컴포넌트영역").innerHTML = 강아지메뉴
                    break;
            }
        }
    </script>
</head>
<body>
    <div>배너이미지</div>
    <div class="내비게이션">
        <button onclick="메뉴이동('일기클릭함')">일기 메뉴</button>
        <button onclick="메뉴이동('강아지클릭함')">강아지 메뉴</button>
    </div>
    <div id="컴포넌트영역"></div>
</body>
</html>
