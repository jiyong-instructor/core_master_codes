<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지번호 실습</title>
    <script>


        window.onload = () => { // 온로드 함수 안에서 작성


            const 철수상자 = new Array(10).fill("철수")
            console.log(철수상자); // 철수상자라는 배열을 만들고, 10개의 요소를 "철수"로 채워준다. 콘솔에는 10개의 "철수"가 들어있는 배열이 출력되겠죠?

            const 페이지들 = 철수상자.map((el, index) =>`
                <button>${index + 1}</button>
            `).join("") // map() 함수를 이용해서 철수상자 배열의 요소를 하나씩 가져와서 버튼 태그로 감싸주고, 
            // index를 이용해서 1부터 10까지의 페이지번호를 만들어준다. join("")을 이용해서 배열을 문자열로 합쳐준다.

            document.getElementById("페이지보여주는곳").innerHTML = 페이지들 // 페이지보여주는곳이라는 id를 가진 div에 페이지들 문자열을 넣어준다.

        }


    </script>
</head>
<body>
    <div id="페이지보여주는곳"></div>
</body>
</html>
