<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지번호 실습</title>
    <script>

        let 시작페이지 = 1; // 시작페이지를 1로 설정

        const 이전페이지기능 = () => {
            시작페이지 = 시작페이지 - 10; // 시작페이지를 10 감소시킨다.
            페이지버튼그리기();
        }

        const 다음페이지기능 = () => {
            시작페이지 = 시작페이지 + 10; // 시작페이지를 10 증가시킨다.
            페이지버튼그리기();
        }


        // 페이지버튼그리기 함수
        const 페이지버튼그리기 = () => {

            const 철수상자 = new Array(10).fill("철수") // 10개의 요소를 가진 배열을 만든다.
            console.log(철수상자); // 콘솔에 10개의 "철수"가 들어있는 배열이 출력된다.

            const 페이지들 = 철수상자.map((el, index)=>`
                <button>${시작페이지 + index}</button>
            `).join("") // map() 함수를 이용해서 철수상자 배열의 요소를 하나씩 가져와서 버튼 태그로 감싸주고,

            document.getElementById("페이지보여주는곳").innerHTML = 페이지들 // 페이지보여주는곳이라는 id를 가진 span에 페이지들 문자열을 넣어준다.
        }

        window.onload = () => { // 온로드 함수 안에서 작성
            페이지버튼그리기(); // 페이지버튼그리기 함수를 호출한다.
        }

    </script>
</head>
<body>
    <button onclick="이전페이지기능()">이전페이지</button>
    <span id="페이지보여주는곳"></span>
    <button onclick="다음페이지기능()">다음페이지</button>
</body>
</html>
