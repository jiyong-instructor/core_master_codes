<!DOCTYPE html>
<html lang="ko">

<head>
    <title>패딩과 마진 스타일 실습</title>
    <style>
        /* 이 방식을 주석이라고 합니다. 그래서 코드 또는 어떠한 메모를 남기고 싶을때 그 코드에 문장에, 영향을 주지
        않고 이렇게 정보 또는 메모를 남겨둘 수 있습니다. */
        .박스1 {
            width: 300px;
            height: 300px;
            background-color: green;
            padding-top: 30px;
            padding-left: 30px;
        }
        .박스2 {
            width: 300px;
            height: 300px;
            background-color: blue;
            margin-top: 30px;
            margin-left: 30px;
        }
        .자식박스 {
            margin-top: 30px;
            margin-left: 30px;
        }
    </style>
</head>

<body>
    
    <div class="박스1">
        <input type="text" />
    </div>

    <div class="박스2">
        <input type="text" class="자식박스" />
    </div>

</body>

</html>
