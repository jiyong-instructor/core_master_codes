<!DOCTYPE html>
<html lang="en">
<head>
    <title>포지션 고정위치 실습</title>
    <style> 
        /* 아래 플로팅 버튼을 이용해서 항상 브라우저 하단에 떠있는 컴포넌트를 만들 수 있어요! */
        .floating_button {
            width: 100px;
            height: 100px;
            background-color: coral;
            border-radius: 100%;
            cursor: pointer;

            position: fixed;
            right: 20px;
            bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="floating_button">

    </div>
</body>
</html>
