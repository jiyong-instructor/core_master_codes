<!DOCTYPE html>
<html lang="en">
<head>
    <title>Rem 사이즈</title>
    <style>
        html {
            font-size: 16px; 
            /* 
                html의 기본 폰트 사이즈는 16px 입니다. 그래서 굳이 안적어 주셔도 됩니다.
                16px은 = 1rem 입니다.
                html에서 가장 윗 단은 root 이라고 부릅니다. 그래서 rem은 root em의 약자입니다.
            */ 
            font-size: 62.5%; 
            /* 
                16px * 0.625 = 10px 
                1rem = 10px
                font size 1rem = 10px
            */
        }

        .상자 {
            width: 10rem; /* 160px */
            height: 10rem;
            background-color: coral;
        }

    </style>
</head>
<body>
    <div class="상자"></div>
    <div class="상자"></div>
    <div class="상자"></div>
</body>
</html>
