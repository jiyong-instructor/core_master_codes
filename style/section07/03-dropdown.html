<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인접형제 결합자 실습 - 드롭다운</title>
    <style>
        * {
            box-sizing: border-box; /* 박스사이징 전역 통일 */
            padding: 0;
            margin: 0;
        }

        .드롭다운제목 {
            appearance: none; /* 기본 스타일 제거 */
            width: 150px;
            height: 40px;
            border: 2px solid green;
            border-radius: 10px;
            padding: 10px;

            --철수의CSS변수: "선택하세요~"
        }

        .드롭다운제목::after {
            content: var(--철수의CSS변수);
        }

        .드롭다운제목:checked + ul {
            display: block; /* 체크되었을 때 드롭다운 목록이 보이도록 */
        }

        .드롭다운목록 {
            display: none; /* 기본적으로 드롭다운 목록은 숨김 */
            width: 150px;
            border: 2px solid green;
            border-radius: 10px;
            overflow: hidden; /* 목록이 넘치지 않도록 */
        }

        .드롭다운목록 input {
            display: none; /* 라디오 버튼 숨김 */
        }

        .드롭다운목록 label {
            display: block; /* label은 in-line element여서 높이가 없으므로 블록으로 변경 */
            padding: 10px;
        }

        .드롭다운목록 label:hover {
            background-color: gold;
        }
    </style>
    <script>
        const 선택가능 = (event) => { // 콘솔로그 찍어보고 개발자 도구로 콘솔 찍어보는 그런 습관
            document.getElementById("드롭다운제목ID").style = `--철수의CSS변수: "${event.target.id}"`;
            document.getElementById("드롭다운제목ID").click(); /* 드롭다운 목록 닫기 */
        }
    </script>
</head>
<body>
    <input type="checkbox" class="드롭다운제목" id="드롭다운제목ID"/>
    <ul class="드롭다운목록">
        <li>
            <input type="radio" name="선택그룹" id="사과클릭" onclick="선택가능(event)" />
            <label for="사과클릭">사과</label>
        </li>
        <li>
            <input type="radio" name="선택그룹" id="바나나클릭" onclick="선택가능(event)" />
            <label for="바나나클릭">바나나</label>
        </li>
        <li>
            <input type="radio" name="선택그룹" id="포도클릭" onclick="선택가능(event)" />
            <label for="포도클릭">포도</label>
        </li>
    </ul>
</body>
</html>
