<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다크모드 실습</title>
    <style>
        .다크모드만들기 {
            color: white;
            background-color: black;
        }
    </style>
    <script>
        const 다크모드기능 = () => {
            document.body.classList.toggle("다크모드만들기"); /* 다크모드만들기 클래스를 토글 */
        }
    </script>
</head>
<body>
    <input type="checkbox" onclick="다크모드기능()" />다크모드

    <br /><br />

    이메일: <input type="text" /><br />
    비밀번호: <input type="password" /><br />
    <button>회원가입</button>
</body>
</html>
