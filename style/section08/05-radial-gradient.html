<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>원형 그라데이션 실습</title>
    <style>
        .상자1 {
            width: 300px;
            height: 300px;
            margin: 20px;

            /* 1. 원형 그라데이션 핑크 > 퍼플 */
            background: radial-gradient(pink, purple);

            /* 2. 원형 그라데이션 핑크 50% > 퍼플 50%~100% */
            background: radial-gradient(pink 50%, purple 50% purple 100%);
        }
        .상자2 {
            width: 300px;
            height: 300px;
            margin: 20px;

            /* 3가지 색상 */
            background: radial-gradient(red, yellow, green);

        }
    </style>
</head>
<body>
    <div class="상자1"></div>
    <div class="상자2"></div>
</body>
</html>
