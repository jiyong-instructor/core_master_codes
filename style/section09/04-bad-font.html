<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>폰트 실습</title>
    <style>
        @font-face {
            font-family: '지용폰트';
            src: url('./00-myfont02-thick.woff2');
        }
        @font-face {
            font-family: '맹구폰트';
            src: url('./00-myfont03-cross-browsing-bad.ttf');
        }

        * {
            font-family: '지용폰트'
        }

        .FOIT방식 {
            font-family: '지용폰트';

            /* foit (최초에 안보여주기) => 그럼에도 3초동안 못 받아오면? 기본폰트 보여줌 */
            font-display: block; /* FOIT 방식 */ 

        }
        .FOUT방식 {
            font-family: '지용폰트';

            /* fout (최초에 기본폰트 보여주고, 다운로드시 바꿔치기) */
            font-display: swap; /* FOUT 방식 */
        }

    </style>
</head>
<body>
    <div class="FOIT방식">안녕하세요</div>
    <div class="FOUT방식">안녕하세요</div>
</body>
</html>
